name: CI

on:
  pull_request:
  push:
    branches: [master, 'ci-debug/**']   # ci-debug 分支：instrumented 修复链先验证再合入 master（建议 2，§9.1）

# 并发取消：连续 push 时取消旧 run（不再干等 ~16min）；workflow 名 CI 与 Release 隔离，tag 触发不受影响（建议 1，§9.1）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make gradlew executable
        run: chmod +x gradlew
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Lint
        run: ./gradlew lintDebug
      - name: Assemble
        run: ./gradlew assembleDebug

  instrumented:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30   # emulator 镜像下载 + 测试首次可能较慢（2.12 合理增补）
    strategy:
      matrix: { api-level: [34] }   # 34 规避 v2 在 API 30 镜像的 UTP API level 读取 bug（API level=1，run 32359568752 实测）
    steps:
      - uses: actions/checkout@v4
      - name: Make gradlew executable
        run: chmod +x gradlew   # 修复：instrumented job 缺此步导致 Permission denied（run 32266737466 实测）
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: reactivecircus/android-emulator-runner@v2   # 恢复 v2：v3 标签不存在（run 32361742157 实测无法解析）
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          script: adb shell getprop ro.build.version.sdk && ./gradlew connectedDebugAndroidTest   # 预热设备属性，修复 PropertyFetcher 超时（run 32371966583：Shell CommandUnresponsiveException，设备被跳过）
